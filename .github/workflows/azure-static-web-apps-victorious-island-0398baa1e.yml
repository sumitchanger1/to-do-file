name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main  # or your default branch
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # needed for PR comments
          action: "upload"
          app_location: "/"     # root folder (where your hh.html is)
          api_location: ""      # leave empty since you have no API
          output_location: ""   # leave empty since you are not using React/Angular build
          skip_app_build: true  # important! prevents Oryx from looking for package.json
